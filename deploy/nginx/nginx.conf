worker_processes 1;
daemon off;
pid /tmp/task-flow-nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/task-flow-nginx/body;
    proxy_temp_path /tmp/task-flow-nginx/proxy;
    fastcgi_temp_path /tmp/task-flow-nginx/fastcgi;
    uwsgi_temp_path /tmp/task-flow-nginx/uwsgi;
    scgi_temp_path /tmp/task-flow-nginx/scgi;
    default_type application/octet-stream;
    charset utf-8;

    types {
        text/html html;
        text/css css;
        application/javascript js;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /home/qkrtkdals/vibe-lab/flow-task/frontend;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
